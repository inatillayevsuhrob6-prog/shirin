<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2a1712">
  <title>{% block title %}ŞİRİN — Har bir tamda baxt bor{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css?v=20261108-telegram5">
</head>
<body>
  {% csrf_token %}
  <div class="loader" id="loader"><div class="loader-mark">S</div><div class="loader-line"></div></div>
  <div class="cursor" id="cursor"></div>
  <nav class="nav">
    <a class="brand" href="/"><span>Ş</span><div>ŞİRİN<small>Şirinliklar atelyesi</small></div></a>
    <button class="nav-toggle" aria-label="Menyu">☰</button>
    <div class="nav-links">
      <a href="/catalog/">Katalog</a>
      <a href="/contact/">Aloqa</a>
    </div>
    <button class="cart-button" id="cartButton" aria-label="Savat"><span class="cart-icon">🛒</span><span id="cartCount">0</span></button>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div><a class="brand footer-brand" href="/"><span>Ş</span><div>ŞİRİN<small>Har bir tamda baxt bor!</small></div></a></div>
    <div><p>+998 99 333 6815</p><p>Qarşi, Özbekiston</p><a href="https://t.me/ShirinUzBot">Telegram @ShirinUzBot</a></div>
  </footer>
  <aside class="cart-drawer" id="cartDrawer">
    <header><h2>🛒 Savat</h2><button id="cartClose" aria-label="Savatni yopiş">×</button></header>
    <div id="cartItems"></div>
    <div class="cart-total"><span>Jami</span><strong id="cartTotal">0 söm</strong></div>
    <button class="btn btn-gold" id="checkoutButton">Buyurtma beriş</button>
  </aside>
  <div class="modal" id="checkoutModal"><div class="modal-card">
    <button class="modal-close" aria-label="Yopish">×</button>
    <h2>Yetkaziş manzili</h2>
    <form id="checkoutForm">
      <input name="name" placeholder="Ismingiz" required>
      <input name="phone" placeholder="Telefon raqamingiz" required>
      <input name="address" placeholder="Mahalla, köça, uy raqami, Qarşi" required>
      <input type="hidden" name="location">
      <button class="location-button" id="getLocation" type="button">📍 Joriy joylaşuvni aniqlash</button>
      <p class="location-status" id="locationStatus" aria-live="polite"></p>
      <input name="delivery_time" placeholder="Yetkaziş vaqti">
      <textarea name="note" placeholder="Qöşimça izoh"></textarea>
      <div class="payment-options"><label><input type="radio" name="payment" value="cash" checked> Naqd</label><label><input type="radio" name="payment" value="card"> Karta</label></div>
      <div class="card-payment" id="cardPayment"><p>Karta orqali tölov</p><img src="/static/img/payment-card.png" alt="I. Suhrob kartasi"><button type="button" class="copy-card" id="copyCard" data-card="5614956265656968"><strong>5614 9562 6565 6968</strong><span>Nusxa oliş</span></button></div>
      <button class="btn btn-gold" type="submit">Tasdiqlaş</button>
    </form>
    <div id="checkoutResult"></div>
  </div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  {{ cart_products|json_script:"cart-products-data" }}
  <script src="/static/js/main.js?v=20261108-orderstatus1"></script>
</body>
</html>
