services:
  - type: web
    name: shirin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: shirin-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: 5944526629

  - type: worker
    name: shirin-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONPATH
        value: backend
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: 5944526629
      - key: DATABASE_URL
        fromDatabase:
          name: shirin-db
          property: connectionString

databases:
  - name: shirin-db
    plan: basic-256mb
