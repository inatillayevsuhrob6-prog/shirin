services:
  - type: web
    name: shirin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed
    startCommand: python bot/main.py & gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: 5944526629

