services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shirin
      POSTGRES_USER: shirin
      POSTGRES_PASSWORD: shirin_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shirin -d shirin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app/backend
    command: sh -c "python manage.py migrate && python manage.py seed && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://shirin:shirin_secret@db:5432/shirin
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app/backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://shirin:shirin_secret@db:5432/shirin
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    command: python bot/main.py
    volumes:
      - ./bot:/app/bot
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql://shirin:shirin_secret@db:5432/shirin
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/srv/static:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
